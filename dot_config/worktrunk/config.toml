worktree-path = "~/worktrees/{{ repo }}.{{ branch | sanitize }}"

# .tool-versions is globally gitignored, so carry it over from the primary
# worktree. Runs as pre-start so post-start installs see the right toolchain.
[pre-start]
tool-versions = """
if [ -f "{{ primary_worktree_path }}/.tool-versions" ] && [ ! -e .tool-versions ]; then
  cp "{{ primary_worktree_path }}/.tool-versions" .tool-versions
fi
"""

# Install JS dependencies with whichever package manager the lockfile implies.
[post-start]
install = """
if [ -f pnpm-lock.yaml ]; then
  pnpm install --frozen-lockfile
elif [ -f yarn.lock ]; then
  yarn install --frozen-lockfile
elif [ -f package-lock.json ]; then
  npm ci
fi
"""

[post-switch]
rex = """
if [ -n "$REX_SESSION" ] && [ -n "$REX_BLOCK" ]; then
  if rex_pane=$(rex block inspect "$REX_BLOCK" -s "$REX_SESSION" --json) &&
     rex_tab=$(printf '%s' "$rex_pane" | jq -er '.block.window_id | strings | select(length > 0)'); then
    rex window rename "$rex_tab" -s "$REX_SESSION" {{ repo ~ ' | ' ~ branch }} ||
      printf '%s\\n' 'Worktrunk: could not rename Rex task tab.' >&2
  else
    printf '%s\\n' 'Worktrunk: could not find the Rex task tab.' >&2
  fi
fi
"""

wezterm = """
if [ -n "$WEZTERM_PANE" ]; then
  wezterm cli set-tab-title --pane-id "$WEZTERM_PANE" "{{ repo }} | {{ branch }}"
fi
"""
